/* ── DESIGN TOKENS ─────────────────────────────────────────── */
:root {
  --al-black: #000000;
  --al-near-black: #1A1A1A;
  --al-gray-900: #222222;
  --al-gray-800: #333333;
  --al-gray-600: #666666;
  --al-gray-400: #999999;
  --al-gray-200: #E0E0E0;
  --al-gray-100: #F2F2F2;
  --al-off-white: #F7F7F7;
  --al-white: #FFFFFF;

  /* Typography */
  --al-heading: 'DM Serif Display', Georgia, serif;
  --al-body: 'DM Sans', system-ui, sans-serif;
  --al-brand: 'Cormorant', Georgia, serif;
}

/* ── GLOBAL RESET ──────────────────────────────────────────── */
/* Force our font stack everywhere LP renders text */
body,
body * {
  font-family: var(--al-body) !important;
}

h1, h2, h3, h4, h5, h6,
.section-intro-title,
.opening__item-text,
.featured-agent-title,
.featured-testimonials-list blockquote,
[class*="heading"] {
  font-family: var(--al-heading) !important;
}

/* Kill LP's default border-radius and box-shadows */
* {
  border-radius: 0 !important;
}

/* ══════════════════════════════════════════════════════════════
   NAV — LP .header
   Prototype: fixed, white bg, blur, logo image left, links center, CTA right
   ══════════════════════════════════════════════════════════════ */
.header {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  z-index: 100 !important;
  height: 72px !important;
  background: rgba(255, 255, 255, 0.95) !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  border-bottom: 1px solid var(--al-gray-200) !important;
  transition: box-shadow 0.3s !important;
  padding: 0 3rem !important;
}

.header.al-scrolled {
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08) !important;
}

.header__container {
  max-width: 100% !important;
  height: 100% !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 0 !important;
}

/* ── Nav Logo ─────────────────────────────────────────────── */
/* JS injects an <img> into .logo — hide LP's text, show image */
.logo__name {
  font-size: 0 !important;
  color: transparent !important;
  overflow: hidden !important;
}

.logo {
  display: flex !important;
  align-items: center !important;
}

/* Injected logo image */
.logo img.al-logo-img {
  height: 40px !important;
  display: block !important;
}

/* ── Nav Links ────────────────────────────────────────────── */
.navigation__link {
  font-size: 0.72rem !important;
  letter-spacing: 0.12em !important;
  text-transform: uppercase !important;
  color: var(--al-gray-600) !important;
  font-weight: 500 !important;
  transition: color 0.2s !important;
  text-decoration: none !important;
}

.navigation__link:hover,
.navigation__link.active {
  color: var(--al-black) !important;
}

/* ── Nav CTA Button ───────────────────────────────────────── */
.header .btn,
.header .btn--outline {
  font-size: 0.72rem !important;
  letter-spacing: 0.1em !important;
  text-transform: uppercase !important;
  padding: 9px 20px !important;
  border: 1px solid var(--al-black) !important;
  color: var(--al-black) !important;
  background: none !important;
  font-weight: 600 !important;
  transition: background 0.2s, color 0.2s !important;
}

.header .btn:hover,
.header .btn--outline:hover {
  background: var(--al-black) !important;
  color: var(--al-white) !important;
}

/* ══════════════════════════════════════════════════════════════
   HERO — LP .opening
   Prototype: Split layout — black left (text/stats) + image right
   LP renders a carousel overlay. We darken it and overlay our typography.
   The split layout is achieved by pushing opening content left and
   letting the image fill right via CSS grid on the container.
   ══════════════════════════════════════════════════════════════ */
.opening {
  position: relative !important;
  min-height: 100vh !important;
  overflow: hidden !important;
}

/* LP carousel slides — darken and desaturate */
.opening .slick-list,
.opening__slider {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}

.opening__slider img,
.opening .slick-slide img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  filter: saturate(0.95) brightness(0.4) !important;
}

/* Content overlay — position bottom-left like prototype hero-left */
.opening__content {
  position: absolute !important;
  inset: 0 !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-end !important;
  padding: 5rem 4rem !important;
  z-index: 2 !important;
  max-width: 55% !important;
}

/* Eyebrow / subtitle above main heading */
.opening .section-intro-subtitle,
.opening__subtitle {
  font-size: 0.65rem !important;
  letter-spacing: 0.22em !important;
  text-transform: uppercase !important;
  color: var(--al-gray-400) !important;
  font-family: var(--al-body) !important;
  font-weight: 500 !important;
  margin-bottom: 1.5rem !important;
  display: flex !important;
  align-items: center !important;
  gap: 0.75rem !important;
}

.opening .section-intro-subtitle::before,
.opening__subtitle::before {
  content: '' !important;
  display: block !important;
  width: 32px !important;
  height: 1px !important;
  background: var(--al-gray-600) !important;
}

/* Main heading — large serif, white */
.opening__item-text,
.opening .section-intro-title {
  font-family: var(--al-heading) !important;
  font-size: clamp(2.8rem, 5vw, 4.2rem) !important;
  font-weight: 400 !important;
  line-height: 1.08 !important;
  color: var(--al-white) !important;
  margin-bottom: 2rem !important;
}

.opening__item-text em,
.opening .section-intro-title em {
  font-style: italic !important;
}

/* Sub-text under heading */
.opening__description,
.opening p:not(.section-intro-subtitle):not(.section-intro-title) {
  font-size: 0.88rem !important;
  line-height: 1.8 !important;
  color: var(--al-gray-400) !important;
  max-width: 380px !important;
  margin-bottom: 2.5rem !important;
  font-weight: 300 !important;
}

/* Hero buttons */
.opening .btn-blue,
.opening .btn.btn-blue {
  background: var(--al-white) !important;
  color: var(--al-black) !important;
  border: none !important;
  padding: 12px 24px !important;
  font-size: 0.72rem !important;
  letter-spacing: 0.1em !important;
  text-transform: uppercase !important;
  font-weight: 600 !important;
}

.opening .btn-blue:hover {
  background: var(--al-gray-100) !important;
  transform: translateY(-1px) !important;
}

.opening .btn--outline {
  border: 1px solid var(--al-gray-600) !important;
  color: var(--al-white) !important;
  padding: 12px 24px !important;
}

.opening .btn--outline:hover {
  border-color: var(--al-white) !important;
  color: var(--al-white) !important;
}

/* Hide LP carousel arrows and dots — single hero image, not a slideshow */
.opening .slick-arrow,
.opening .slick-dots,
.opening .slider-arrow {
  display: none !important;
}

/* ══════════════════════════════════════════════════════════════
   HISTORY SEAM — injected by JS after .opening
   Scrolling neighborhood ticker bar
   ══════════════════════════════════════════════════════════════ */
.al-history-seam {
  background: var(--al-near-black) !important;
  overflow: hidden !important;
  display: flex !important;
  align-items: center !important;
  gap: 3rem !important;
  padding: 0 3rem !important;
  height: 72px !important;
  white-space: nowrap !important;
}

.al-seam-label {
  font-size: 0.62rem !important;
  letter-spacing: 0.18em !important;
  text-transform: uppercase !important;
  color: var(--al-gray-600) !important;
  flex-shrink: 0 !important;
  font-weight: 600 !important;
  display: flex !important;
  align-items: center !important;
  gap: 0.75rem !important;
}

.al-seam-label::after {
  content: '' !important;
  display: block !important;
  width: 24px !important;
  height: 1px !important;
  background: var(--al-gray-600) !important;
}

.al-seam-scroll {
  display: flex !important;

.al-seam-scroll span {
  font-size: 0.7rem !important;

  text-transform: uppercase !important;
  color: var(--al-gray-600) !important;
  opacity: 0.7 !important;
}

@keyframes al-seam-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
