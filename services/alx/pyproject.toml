[project]
name = "alx-agent"
version = "0.1.0"
description = "ALX — Canary Go VSM and Delivery Manager agent (Mercury Astronaut)"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=0.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
