[project]
name = "growdirect-mcp"
version = "0.1.0"
description = "GrowDirect platform MCP SDK wrapper — shared conventions for all app MCP servers"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
