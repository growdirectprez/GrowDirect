[project]
name = "memory-bus"
version = "0.1.0"
description = "GrowDirect platform memory bus — MCP server for organizational knowledge"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "sqlalchemy>=2.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "alembic>=1.13",
    "growdirect-mcp>=0.1.0",
    "google-auth>=2.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
