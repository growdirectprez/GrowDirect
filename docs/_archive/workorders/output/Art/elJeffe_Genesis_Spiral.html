<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elJeffe — The Genesis Spiral</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0d1117;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
        }
        canvas#bg { position: fixed; top: 0; left: 0; z-index: 0; }
        canvas#spiral { position: fixed; top: 0; left: 0; z-index: 1; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            padding-bottom: 5vh;
        }
        .tagline {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.7rem, 1.4vw, 1.1rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(245, 158, 11, 0.0);
            transition: color 3s ease;
            text-align: center;
            line-height: 2;
        }
        .tagline.visible { color: rgba(245, 158, 11, 0.85); }
        .tagline .sub {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.55rem, 1vw, 0.8rem);
            letter-spacing: 6px;
            color: rgba(160, 160, 160, 0.0);
            transition: color 4s ease 1s;
            margin-top: 4px;
        }
        .tagline.visible .sub { color: rgba(160, 160, 160, 0.7); }

        /* Layer labels that appear around the spiral */
        .layer-label {
            position: fixed;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: clamp(0.5rem, 0.9vw, 0.75rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 3;
            pointer-events: none;
            white-space: nowrap;
        }
        .layer-label.show { opacity: 1; }
    </style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="spiral"></canvas>
<div class="overlay">
    <div class="tagline" id="tagline">
        The Canary in the Data Mine
        <span class="sub">Sovereignty through verification</span>
    </div>
</div>

<!-- Layer labels positioned dynamically by JS -->
<div class="layer-label" id="lbl-genesis" style="color: #f59e0b;">Genesis</div>
<div class="layer-label" id="lbl-canary" style="color: #f59e0b;">Canary</div>
<div class="layer-label" id="lbl-protocol" style="color: #2563eb;">Protocol</div>
<div class="layer-label" id="lbl-namespace" style="color: #e84142;">Namespace</div>
<div class="layer-label" id="lbl-raas" style="color: #a78bfa;">Receipt-as-a-Service</div>
<div class="layer-label" id="lbl-sovereign" style="color: #34d399;">The Sovereign Individual</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const COLORS = {
    bg: '#0d1117',
    amber: '#f59e0b',
    amberDim: 'rgba(245,158,11,0.15)',
    blue: '#2563eb',
    blueDim: 'rgba(37,99,235,0.12)',
    red: '#e84142',
    redDim: 'rgba(232,65,66,0.12)',
    purple: '#a78bfa',
    green: '#34d399',
    mist: 'rgba(160,160,160,0.04)',
    particle: 'rgba(245,158,11,0.6)',
};

// Spiral layers — each layer maps to the Manifesto
const LAYERS = [
    { name: 'Genesis',       color: COLORS.amber,  glowColor: 'rgba(245,158,11,0.35)', radiusStart: 0,    radiusEnd: 0.08 },
    { name: 'Canary',        color: COLORS.amber,  glowColor: 'rgba(245,158,11,0.20)', radiusStart: 0.08, radiusEnd: 0.18 },
    { name: 'Protocol',      color: COLORS.blue,   glowColor: 'rgba(37,99,235,0.18)',  radiusStart: 0.18, radiusEnd: 0.30 },
    { name: 'Namespace',     color: COLORS.red,    glowColor: 'rgba(232,65,66,0.15)',  radiusStart: 0.30, radiusEnd: 0.42 },
    { name: 'RaaS',          color: COLORS.purple, glowColor: 'rgba(167,139,250,0.12)',radiusStart: 0.42, radiusEnd: 0.56 },
    { name: 'Sovereign',     color: COLORS.green,  glowColor: 'rgba(52,211,153,0.10)', radiusStart: 0.56, radiusEnd: 0.72 },
];

// ============================================================
// CANVAS SETUP
// ============================================================
const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d');
const spiralCanvas = document.getElementById('spiral');
const ctx = spiralCanvas.getContext('2d');
let W, H, cx, cy, maxR;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    bgCanvas.width = spiralCanvas.width = W;
    bgCanvas.height = spiralCanvas.height = H;
    cx = W / 2;
    cy = H * 0.46;
    maxR = Math.min(W, H) * 0.42;
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// BACKGROUND — Floating algorithm glyphs in the mist
// ============================================================
const glyphs = '∑∏∫∂Δ∇λΩπσθ∞≈≠≡∝⊕⊗⌈⌉⟨⟩₿⛓◆◇▲▽'.split('');
const GLYPH_COUNT = 60;
class Glyph {
    constructor() { this.reset(true); }
    reset(init) {
        this.x = Math.random() * W;
        this.y = init ? Math.random() * H : H + 20;
        this.char = glyphs[Math.floor(Math.random() * glyphs.length)];
        this.size = 8 + Math.random() * 14;
        this.alpha = 0.015 + Math.random() * 0.04;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = -0.15 - Math.random() * 0.4;
        this.drift = Math.random() * Math.PI * 2;
        this.driftSpeed = 0.002 + Math.random() * 0.004;
    }
    update() {
        this.drift += this.driftSpeed;
        this.x += this.vx + Math.sin(this.drift) * 0.15;
        this.y += this.vy;
        if (this.y < -30 || this.x < -30 || this.x > W + 30) this.reset(false);
    }
    draw(c) {
        c.save();
        c.globalAlpha = this.alpha;
        c.fillStyle = '#a0a0a0';
        c.font = `${this.size}px "Space Grotesk", monospace`;
        c.textAlign = 'center';
        c.fillText(this.char, this.x, this.y);
        c.restore();
    }
}
const glyphParticles = Array.from({ length: GLYPH_COUNT }, () => new Glyph());

// Blockchain chain-link particles floating
const CHAIN_COUNT = 18;
class ChainLink {
    constructor() { this.reset(true); }
    reset(init) {
        this.x = Math.random() * W;
        this.y = init ? Math.random() * H : -20;
        this.size = 3 + Math.random() * 5;
        this.alpha = 0.03 + Math.random() * 0.06;
        this.vy = 0.1 + Math.random() * 0.25;
        this.angle = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.color = [COLORS.amber, COLORS.blue, COLORS.red][Math.floor(Math.random() * 3)];
    }
    update() {
        this.y += this.vy;
        this.angle += this.rotSpeed;
        if (this.y > H + 30) this.reset(false);
    }
    draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.angle);
        c.globalAlpha = this.alpha;
        c.strokeStyle = this.color;
        c.lineWidth = 1;
        // Draw a simple chain link (two overlapping ovals)
        c.beginPath();
        c.ellipse(-this.size * 0.3, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
        c.stroke();
        c.beginPath();
        c.ellipse(this.size * 0.3, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
        c.stroke();
        c.restore();
    }
}
const chainLinks = Array.from({ length: CHAIN_COUNT }, () => new ChainLink());

function drawBackground() {
    bgCtx.fillStyle = COLORS.bg;
    bgCtx.fillRect(0, 0, W, H);

    // Subtle radial mist from center
    const grad = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 1.5);
    grad.addColorStop(0, 'rgba(245,158,11,0.03)');
    grad.addColorStop(0.3, 'rgba(37,99,235,0.02)');
    grad.addColorStop(0.6, 'rgba(232,65,66,0.01)');
    grad.addColorStop(1, 'transparent');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, W, H);

    glyphParticles.forEach(g => { g.update(); g.draw(bgCtx); });
    chainLinks.forEach(c => { c.update(); c.draw(bgCtx); });
}

// ============================================================
// SPIRAL — The Genesis Spiral growing outward
// ============================================================
const TOTAL_TURNS = 6;       // full spiral turns
const POINTS_PER_TURN = 360;
const TOTAL_POINTS = TOTAL_TURNS * POINTS_PER_TURN;
const SPIRAL_GROWTH_SPEED = 1.8; // points per frame
let currentPoint = 0;
let spiralComplete = false;

// Energy particles flowing along the spiral (the closed loop feeding back)
const ENERGY_COUNT = 40;
class EnergyParticle {
    constructor() {
        this.t = Math.random(); // position along spiral [0,1]
        this.speed = 0.001 + Math.random() * 0.002;
        this.size = 1 + Math.random() * 2.5;
        this.brightness = 0.4 + Math.random() * 0.6;
    }
    update() {
        this.t += this.speed;
        if (this.t > 1) this.t -= 1;
    }
}
const energyParticles = Array.from({ length: ENERGY_COUNT }, () => new EnergyParticle());

function getSpiralPoint(i) {
    const t = i / TOTAL_POINTS;
    const angle = t * TOTAL_TURNS * Math.PI * 2 - Math.PI / 2;
    // Logarithmic-ish spiral with acceleration
    const r = maxR * Math.pow(t, 0.7);
    return {
        x: cx + Math.cos(angle) * r,
        y: cy + Math.sin(angle) * r,
        r: r,
        t: t,
        angle: angle
    };
}

function getLayerForT(t) {
    for (let i = 0; i < LAYERS.length; i++) {
        if (t >= LAYERS[i].radiusStart && t < LAYERS[i].radiusEnd) return LAYERS[i];
    }
    return LAYERS[LAYERS.length - 1];
}

function drawSpiral(time) {
    ctx.clearRect(0, 0, W, H);

    // Grow the spiral
    if (currentPoint < TOTAL_POINTS) {
        currentPoint = Math.min(currentPoint + SPIRAL_GROWTH_SPEED, TOTAL_POINTS);
    } else if (!spiralComplete) {
        spiralComplete = true;
        // Show tagline
        setTimeout(() => document.getElementById('tagline').classList.add('visible'), 500);
    }

    const drawnPoints = Math.floor(currentPoint);

    // GENESIS CORE — Pulsing ember at center (the canary)
    const pulse = 0.7 + 0.3 * Math.sin(time * 0.003);
    const coreR = maxR * 0.035 * pulse;

    // Core glow layers
    for (let i = 4; i >= 0; i--) {
        const gr = coreR * (1 + i * 1.2);
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
        grad.addColorStop(0, `rgba(245,158,11,${0.15 - i * 0.025})`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, gr, 0, Math.PI * 2);
        ctx.fill();
    }
    // Core bright center
    ctx.fillStyle = `rgba(245,158,11,${0.6 + 0.3 * pulse})`;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR * 0.6, 0, Math.PI * 2);
    ctx.fill();
    // White-hot center
    ctx.fillStyle = `rgba(255,255,255,${0.3 * pulse})`;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR * 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Draw spiral trail
    if (drawnPoints > 1) {
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';

        // Draw in segments per layer for color transitions
        let segStart = 0;
        for (let i = 1; i < drawnPoints; i++) {
            const p = getSpiralPoint(i);
            const pPrev = getSpiralPoint(i - 1);
            const layer = getLayerForT(p.t);
            const layerPrev = getLayerForT(pPrev.t);

            if (layer !== layerPrev || i === drawnPoints - 1) {
                // Draw accumulated segment
                ctx.beginPath();
                const first = getSpiralPoint(segStart);
                ctx.moveTo(first.x, first.y);
                for (let j = segStart + 1; j <= i; j++) {
                    const pp = getSpiralPoint(j);
                    ctx.lineTo(pp.x, pp.y);
                }
                const alpha = 0.15 + 0.35 * (1 - getSpiralPoint(segStart).t);
                ctx.strokeStyle = layerPrev.color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
                // Fallback for hex colors
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = layerPrev.color;
                ctx.stroke();
                ctx.globalAlpha = 1;

                // Layer glow
                ctx.save();
                ctx.filter = `blur(6px)`;
                ctx.globalAlpha = alpha * 0.3;
                ctx.strokeStyle = layerPrev.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(first.x, first.y);
                for (let j = segStart + 1; j <= i; j++) {
                    const pp = getSpiralPoint(j);
                    ctx.lineTo(pp.x, pp.y);
                }
                ctx.stroke();
                ctx.restore();

                segStart = i;
            }
        }
    }

    // Growing tip — bright leading edge
    if (drawnPoints > 2 && drawnPoints < TOTAL_POINTS) {
        const tip = getSpiralPoint(drawnPoints);
        const layer = getLayerForT(tip.t);
        const tipGrad = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 12);
        tipGrad.addColorStop(0, layer.color);
        tipGrad.addColorStop(0.4, layer.glowColor);
        tipGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = tipGrad;
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 12, 0, Math.PI * 2);
        ctx.fill();
        // White core of tip
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Energy particles flowing along the spiral — the closed loop
    if (spiralComplete) {
        energyParticles.forEach(ep => {
            ep.update();
            const idx = Math.floor(ep.t * TOTAL_POINTS);
            const p = getSpiralPoint(idx);
            const layer = getLayerForT(ep.t);
            ctx.fillStyle = layer.color;
            ctx.globalAlpha = ep.brightness * 0.7;
            ctx.beginPath();
            ctx.arc(p.x, p.y, ep.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Return flow — particles spiraling back inward (the feedback loop)
        // Drawn as faint amber streaks from outer edge back to center
        const returnCount = 8;
        for (let i = 0; i < returnCount; i++) {
            const phase = (time * 0.0008 + i * (Math.PI * 2 / returnCount)) % (Math.PI * 2);
            const progress = (Math.sin(phase) + 1) / 2; // 0 to 1 oscillation
            const r = maxR * 0.7 * (1 - progress);
            const angle = phase * 3 - Math.PI / 2;
            const px = cx + Math.cos(angle) * r;
            const py = cy + Math.sin(angle) * r;
            const alpha = 0.05 + 0.15 * (1 - progress);
            ctx.fillStyle = COLORS.amber;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(px, py, 1.5 + progress * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    // LAYER LABELS — Position dynamically around spiral
    const labelDefs = [
        { id: 'lbl-genesis',   t: 0.04,  offset: { x: 30, y: -20 }, showAt: 0.06 },
        { id: 'lbl-canary',    t: 0.13,  offset: { x: 35, y: 10 },  showAt: 0.16 },
        { id: 'lbl-protocol',  t: 0.24,  offset: { x: -40, y: -25 },showAt: 0.28 },
        { id: 'lbl-namespace', t: 0.36,  offset: { x: 40, y: 15 },  showAt: 0.40 },
        { id: 'lbl-raas',      t: 0.49,  offset: { x: -50, y: -20 },showAt: 0.52 },
        { id: 'lbl-sovereign', t: 0.64,  offset: { x: 40, y: 20 },  showAt: 0.68 },
    ];

    const currentT = drawnPoints / TOTAL_POINTS;
    labelDefs.forEach(ld => {
        const el = document.getElementById(ld.id);
        const p = getSpiralPoint(Math.floor(ld.t * TOTAL_POINTS));
        el.style.left = (p.x + ld.offset.x) + 'px';
        el.style.top = (p.y + ld.offset.y) + 'px';
        if (currentT >= ld.showAt) {
            el.classList.add('show');
        }
    });
}

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate(time) {
    drawBackground();
    drawSpiral(time);
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
