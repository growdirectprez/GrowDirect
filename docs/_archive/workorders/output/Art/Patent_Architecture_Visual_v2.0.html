<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Six-Node Architecture — Visual Schematic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
  svg { display: block; margin: 0 auto; }
  .fig-label { text-anchor: middle; font-size: 11px; fill: #f59e0b; font-weight: 600; letter-spacing: 1px; }
  .title { text-anchor: middle; font-size: 16px; fill: #f0f0f0; font-weight: 600; letter-spacing: 1.5px; }
  .subtitle { text-anchor: middle; font-size: 11px; fill: #666; letter-spacing: 0.5px; }
  .footer-text { text-anchor: middle; font-size: 9px; fill: #444; letter-spacing: 0.5px; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 1300" width="1000" height="1300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowheads -->
    <marker id="arr-white" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#10b981"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f59e0b"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ef4444"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3b82f6"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/></marker>

    <!-- Glows -->
    <filter id="glow-blue"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-green"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-amber"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b69;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2e0a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="35" class="title">UNIVERSAL EVENT NOTARIZATION — SIX-NODE ARCHITECTURE</text>
  <text x="500" y="52" class="subtitle">Staged Immutability Pipeline · Proof-of-Work Base-Layer Anchoring</text>
  <text x="500" y="68" class="fig-label">FIG. 1 — SYSTEM ARCHITECTURE</text>

  <!-- ═══ NODE 1: SOURCE NETWORKS ═══ -->
  <!-- Cloud shape for source -->
  <ellipse cx="500" cy="130" rx="200" ry="45" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <ellipse cx="500" cy="130" rx="200" ry="45" fill="#3b82f6" opacity="0.06"/>
  <text x="500" y="122" text-anchor="middle" font-size="13" fill="#60a5fa" font-weight="600">SOURCE NETWORKS</text>
  <text x="500" y="140" text-anchor="middle" font-size="10" fill="#888">Square · Shopify · Epic · FedEx · Legal · Insurance · Gov</text>
  <!-- Node label -->
  <rect x="355" y="88" width="50" height="18" rx="3" fill="#3b82f6" opacity="0.2"/>
  <text x="380" y="100" text-anchor="middle" font-size="9" fill="#60a5fa" font-weight="700">NODE 1</text>

  <!-- Arrow: Source → Gateway -->
  <line x1="500" y1="175" x2="500" y2="215" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="520" y="200" font-size="9" fill="#3b82f6">webhook POST</text>

  <!-- ═══ NODE 2: API GATEWAY ═══ -->
  <rect x="340" y="220" width="320" height="70" rx="10" fill="url(#grad-purple)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="248" text-anchor="middle" font-size="13" fill="#a78bfa" font-weight="600">API GATEWAY</text>
  <text x="500" y="265" text-anchor="middle" font-size="10" fill="#888">HMAC verify · SHA-256 hash · queue publish</text>
  <text x="500" y="280" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">200 OK &lt; 5ms</text>
  <rect x="355" y="222" width="50" height="18" rx="3" fill="#8b5cf6" opacity="0.2"/>
  <text x="380" y="234" text-anchor="middle" font-size="9" fill="#a78bfa" font-weight="700">NODE 2</text>

  <!-- Arrow: Gateway → Queue -->
  <line x1="500" y1="290" x2="500" y2="330" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- ═══ MESSAGE QUEUE ═══ -->
  <!-- Hexagon shape for queue -->
  <polygon points="500,335 600,365 600,405 500,435 400,405 400,365" fill="url(#grad-yellow)" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="500" y="378" text-anchor="middle" font-size="13" fill="#fbbf24" font-weight="700">QUEUE</text>
  <text x="500" y="395" text-anchor="middle" font-size="9" fill="#fcd34d">fan-out × 3</text>

  <!-- ═══ FAN-OUT ARROWS ═══ -->
  <!-- Left: Queue → Sub 1 -->
  <path d="M 430 420 Q 300 460 200 500" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <!-- Center: Queue → Sub 2 -->
  <line x1="500" y1="435" x2="500" y2="500" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <!-- Right: Queue → Sub 3 -->
  <path d="M 570 420 Q 700 460 800 500" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- ═══ SUB 1: HASH & SEAL ═══ -->
  <rect x="80" y="510" width="240" height="130" rx="12" fill="#0d1117" stroke="#10b981" stroke-width="2.5"/>
  <!-- Icon: Shield -->
  <circle cx="130" cy="545" r="18" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="130" y="550" text-anchor="middle" font-size="16">🛡️</text>
  <text x="220" y="545" text-anchor="middle" font-size="14" fill="#34d399" font-weight="600">HASH & SEAL</text>
  <text x="200" y="565" text-anchor="middle" font-size="10" fill="#888">Write-once · Append-only</text>
  <text x="200" y="580" text-anchor="middle" font-size="10" fill="#888">SHA-256 chain links</text>
  <text x="200" y="595" text-anchor="middle" font-size="10" fill="#888">Bilateral verification</text>
  <!-- Badge -->
  <rect x="140" y="610" width="120" height="22" rx="11" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="200" y="625" text-anchor="middle" font-size="10" fill="#6ee7b7" font-weight="700">IMMUTABLE</text>
  <!-- Node label -->
  <rect x="90" y="512" width="75" height="16" rx="3" fill="#10b981" opacity="0.2"/>
  <text x="128" y="523" text-anchor="middle" font-size="8" fill="#34d399" font-weight="700">SUB 1 · NODE 3</text>
  <!-- Timing -->
  <text x="200" y="653" text-anchor="middle" font-size="10" fill="#10b981" font-weight="600">T+0ms</text>

  <!-- ═══ SUB 2: PARSE & ROUTE ═══ -->
  <rect x="380" y="510" width="240" height="130" rx="12" fill="#0d1117" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Icon: Database -->
  <circle cx="430" cy="545" r="18" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="550" text-anchor="middle" font-size="16">📊</text>
  <text x="520" y="545" text-anchor="middle" font-size="14" fill="#fbbf24" font-weight="600">PARSE & ROUTE</text>
  <text x="500" y="565" text-anchor="middle" font-size="10" fill="#888">Structured · Queryable</text>
  <text x="500" y="580" text-anchor="middle" font-size="10" fill="#888">Indexed by merchant</text>
  <text x="500" y="595" text-anchor="middle" font-size="10" fill="#888">Replayable from Sub 1</text>
  <!-- Badge -->
  <rect x="440" y="610" width="120" height="22" rx="11" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="625" text-anchor="middle" font-size="10" fill="#fcd34d" font-weight="700">RESILIENT</text>
  <rect x="390" y="512" width="75" height="16" rx="3" fill="#f59e0b" opacity="0.2"/>
  <text x="428" y="523" text-anchor="middle" font-size="8" fill="#fbbf24" font-weight="700">SUB 2 · NODE 4</text>
  <text x="500" y="653" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="600">T+15ms</text>

  <!-- ═══ SUB 3: MERKLE & ORDINAL ═══ -->
  <rect x="680" y="510" width="240" height="130" rx="12" fill="#0d1117" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Icon: Bitcoin -->
  <circle cx="730" cy="545" r="18" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
  <text x="730" y="550" text-anchor="middle" font-size="16">₿</text>
  <text x="820" y="545" text-anchor="middle" font-size="14" fill="#f87171" font-weight="600">MERKLE & ORDINAL</text>
  <text x="800" y="565" text-anchor="middle" font-size="10" fill="#888">Batch → Merkle tree</text>
  <text x="800" y="580" text-anchor="middle" font-size="10" fill="#888">Ordinal inscription</text>
  <text x="800" y="595" text-anchor="middle" font-size="10" fill="#888">Key custody (treasury)</text>
  <!-- Badge -->
  <rect x="740" y="610" width="120" height="22" rx="11" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="800" y="625" text-anchor="middle" font-size="10" fill="#fca5a5" font-weight="700">PERMANENT</text>
  <rect x="690" y="512" width="80" height="16" rx="3" fill="#ef4444" opacity="0.2"/>
  <text x="730" y="523" text-anchor="middle" font-size="8" fill="#f87171" font-weight="700">SUB 3 · NODE 5/6</text>
  <text x="800" y="653" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="600">T+~10min</text>

  <!-- ═══ STORAGE LAYER ═══ -->
  <!-- Evidence Store (cylinder) -->
  <ellipse cx="200" cy="710" rx="70" ry="12" fill="#1e3a5f" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="130" y="710" width="140" height="50" fill="#1e3a5f" stroke="none"/>
  <line x1="130" y1="710" x2="130" y2="760" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="340" y1="710" x2="340" y2="760" stroke="none"/>
  <line x1="270" y1="710" x2="270" y2="760" stroke="#1e40af" stroke-width="1.5"/>
  <ellipse cx="200" cy="760" rx="70" ry="12" fill="#1e3a5f" stroke="#1e40af" stroke-width="1.5"/>
  <text x="200" y="732" text-anchor="middle" font-size="11" fill="#60a5fa" font-weight="600">Evidence Store</text>
  <text x="200" y="748" text-anchor="middle" font-size="9" fill="#888">Write-Once JSONB</text>
  <!-- Arrow Sub1 → Evidence -->
  <line x1="200" y1="640" x2="200" y2="697" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Structured Store (cylinder) -->
  <ellipse cx="500" cy="710" rx="70" ry="12" fill="#1e3a5f" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="430" y="710" width="140" height="50" fill="#1e3a5f" stroke="none"/>
  <line x1="430" y1="710" x2="430" y2="760" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="570" y1="710" x2="570" y2="760" stroke="#1e40af" stroke-width="1.5"/>
  <ellipse cx="500" cy="760" rx="70" ry="12" fill="#1e3a5f" stroke="#1e40af" stroke-width="1.5"/>
  <text x="500" y="732" text-anchor="middle" font-size="11" fill="#60a5fa" font-weight="600">Structured Store</text>
  <text x="500" y="748" text-anchor="middle" font-size="9" fill="#888">Partitioned Tables</text>
  <!-- Arrow Sub2 → Structured -->
  <line x1="500" y1="640" x2="500" y2="697" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Bitcoin (special shape) -->
  <circle cx="800" cy="735" r="40" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="800" cy="735" r="40" fill="#ef4444" opacity="0.05"/>
  <text x="800" y="730" text-anchor="middle" font-size="22" fill="#f87171">₿</text>
  <text x="800" y="750" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">TIME CHAIN</text>
  <!-- Arrow Sub3 → Bitcoin -->
  <line x1="800" y1="640" x2="800" y2="693" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ═══ REPLAY ARROW (dashed: Evidence → Structured) ═══ -->
  <path d="M 270 735 L 430 735" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-white)"/>
  <text x="350" y="728" text-anchor="middle" font-size="8" fill="#666">replay / rebuild</text>

  <!-- ═══ APPLICATION LAYER ═══ -->
  <!-- Detection + Dashboard -->
  <rect x="350" y="810" width="180" height="60" rx="8" fill="#0d1117" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="835" text-anchor="middle" font-size="11" fill="#34d399" font-weight="600">Detection Engine</text>
  <text x="440" y="850" text-anchor="middle" font-size="9" fill="#888">Rules · Alerts · Dashboard</text>
  <!-- Arrow Structured → Detection -->
  <line x1="500" y1="772" x2="470" y2="808" stroke="#f59e0b" stroke-width="1" marker-end="url(#arr-amber)"/>

  <!-- ═══ VALIDATION API (L402) ═══ -->
  <rect x="580" y="810" width="180" height="60" rx="8" fill="#0d1117" stroke="#f59e0b" stroke-width="2"/>
  <!-- Lightning bolt -->
  <text x="610" y="840" font-size="16">⚡</text>
  <text x="690" y="835" text-anchor="middle" font-size="11" fill="#fbbf24" font-weight="600">L402 Validation</text>
  <text x="690" y="850" text-anchor="middle" font-size="9" fill="#888">Sat-gated · Perpetual revenue</text>
  <!-- Arrows into Validation -->
  <path d="M 250 772 Q 250 830 578 840" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <path d="M 800 775 Q 800 810 762 830" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- ═══ BILATERAL VERIFICATION ═══ -->
  <!-- Dashed box spanning bottom -->
  <rect x="120" y="910" width="760" height="65" rx="10" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="120" y="910" width="760" height="65" rx="10" fill="#3b82f6" opacity="0.03"/>
  <text x="500" y="938" text-anchor="middle" font-size="12" fill="#60a5fa" font-weight="600">BILATERAL VERIFICATION — NO TRUST REQUIRED</text>
  <text x="500" y="958" text-anchor="middle" font-size="10" fill="#888">Source send log ↔ Evidence hash ↔ Merkle proof ↔ Bitcoin block explorer</text>

  <!-- Arrow from Validation down to Bilateral -->
  <line x1="670" y1="870" x2="670" y2="908" stroke="#555" stroke-width="1" marker-end="url(#arr-white)"/>

  <!-- ═══ KEY INNOVATION CALLOUTS ═══ -->
  <!-- Triple subscriber callout -->
  <rect x="60" y="440" width="160" height="50" rx="8" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="140" y="460" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="700">INNOVATION</text>
  <text x="140" y="475" text-anchor="middle" font-size="8" fill="#a78bfa">Triple Subscriber Pattern</text>
  <text x="140" y="486" text-anchor="middle" font-size="8" fill="#a78bfa">3 independent consumers</text>

  <!-- Key custody callout -->
  <rect x="870" y="700" width="110" height="50" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="925" y="718" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="700">KEY CUSTODY</text>
  <text x="925" y="732" text-anchor="middle" font-size="8" fill="#f87171">Treasury controls</text>
  <text x="925" y="744" text-anchor="middle" font-size="8" fill="#f87171">all inscription keys</text>

  <!-- Revenue callout -->
  <rect x="720" y="880" width="140" height="30" rx="6" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1"/>
  <text x="790" y="900" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">💰 Revenue per verification, forever</text>

  <!-- Footer -->
  <text x="500" y="1010" class="footer-text">APPLICATION 63/991,596 · Filed February 26, 2026 · PATENT PENDING · CONFIDENTIAL</text>
</svg>
</body>
</html>
