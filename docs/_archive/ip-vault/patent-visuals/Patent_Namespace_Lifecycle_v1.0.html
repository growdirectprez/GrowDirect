<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namespace Lifecycle — FIG. 5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 1100" width="1000" height="1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-w" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555"/></marker>
    <marker id="a-y" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f59e0b"/></marker>
    <marker id="a-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#10b981"/></marker>
    <marker id="a-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3b82f6"/></marker>
    <marker id="a-p" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/></marker>
    <marker id="a-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ef4444"/></marker>

    <linearGradient id="btc-grd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a0a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ TITLE ═══ -->
  <text x="500" y="38" text-anchor="middle" font-size="17" fill="#f0f0f0" font-weight="600" letter-spacing="1.5">.JEFFE NAMESPACE LIFECYCLE</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#666">Birth on Bitcoin · Cached in Postgres · Identity Outlives Infrastructure</text>
  <text x="500" y="78" text-anchor="middle" font-size="12" fill="#f59e0b" font-weight="600" letter-spacing="1">FIG. 5 — NAMESPACE REGISTRATION FLOW</text>

  <!-- ═══ SWIM LANE HEADERS ═══ -->
  <rect x="80" y="100" width="180" height="30" rx="4" fill="#f59e0b" opacity="0.12"/>
  <text x="170" y="120" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700" letter-spacing="1">BITCOIN (LEDGER)</text>

  <rect x="310" y="100" width="180" height="30" rx="4" fill="#8b5cf6" opacity="0.12"/>
  <text x="400" y="120" text-anchor="middle" font-size="10" fill="#a78bfa" font-weight="700" letter-spacing="1">INDEXER</text>

  <rect x="540" y="100" width="180" height="30" rx="4" fill="#10b981" opacity="0.12"/>
  <text x="630" y="120" text-anchor="middle" font-size="10" fill="#34d399" font-weight="700" letter-spacing="1">POSTGRES (CACHE)</text>

  <rect x="770" y="100" width="160" height="30" rx="4" fill="#3b82f6" opacity="0.12"/>
  <text x="850" y="120" text-anchor="middle" font-size="10" fill="#60a5fa" font-weight="700" letter-spacing="1">APPLICATION</text>

  <!-- Vertical swim lane lines -->
  <line x1="290" y1="140" x2="290" y2="950" stroke="#222" stroke-width="1"/>
  <line x1="520" y1="140" x2="520" y2="950" stroke="#222" stroke-width="1"/>
  <line x1="750" y1="140" x2="750" y2="950" stroke="#222" stroke-width="1"/>

  <!-- ═══ STEP 1: MERCHANT REQUESTS NAMESPACE ═══ -->
  <text x="50" y="185" font-size="10" fill="#666" font-weight="700">1</text>
  <rect x="770" y="165" width="160" height="50" rx="8" fill="#0d1117" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="850" y="188" text-anchor="middle" font-size="10" fill="#60a5fa" font-weight="600">Merchant Request</text>
  <text x="850" y="203" text-anchor="middle" font-size="9" fill="#888">"sunrise-coffee"</text>

  <!-- Arrow: App → Indexer -->
  <line x1="770" y1="190" x2="490" y2="190" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a-b)"/>
  <text x="630" y="183" text-anchor="middle" font-size="8" fill="#3b82f6">register request</text>

  <!-- ═══ STEP 2: CONSTRUCT INSCRIPTION ═══ -->
  <text x="50" y="265" font-size="10" fill="#666" font-weight="700">2</text>
  <rect x="310" y="240" width="180" height="65" rx="8" fill="#0d1117" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="262" text-anchor="middle" font-size="10" fill="#a78bfa" font-weight="600">Build Inscription</text>
  <text x="400" y="278" text-anchor="middle" font-size="9" fill="#888">type: "namespace"</text>
  <text x="400" y="292" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">name: "sunrise-coffee"</text>

  <!-- Arrow: Indexer → Bitcoin -->
  <line x1="310" y1="272" x2="260" y2="272" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-y)"/>
  <text x="285" y="264" text-anchor="middle" font-size="8" fill="#f59e0b">inscribe</text>

  <!-- ═══ STEP 3: BITCOIN INSCRIPTION (THE BIRTH) ═══ -->
  <text x="50" y="370" font-size="10" fill="#666" font-weight="700">3</text>

  <!-- Prominent Bitcoin box -->
  <rect x="80" y="335" width="180" height="100" rx="12" fill="url(#btc-grd)" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="170" cy="370" r="16" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>
  <text x="170" y="365" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700">₿ INSCRIPTION</text>
  <text x="170" y="382" text-anchor="middle" font-size="9" fill="#fbbf24">CANONICAL IDENTITY</text>

  <text x="170" y="405" text-anchor="middle" font-size="8" fill="#888">name: "sunrise-coffee"</text>
  <text x="170" y="418" text-anchor="middle" font-size="8" fill="#888">block: 891,234</text>
  <text x="170" y="431" text-anchor="middle" font-size="8" fill="#f59e0b">PERMANENT · IMMUTABLE</text>

  <!-- Birth badge -->
  <rect x="195" y="338" width="55" height="16" rx="8" fill="#f59e0b" opacity="0.25" stroke="#f59e0b" stroke-width="1"/>
  <text x="222" y="349" text-anchor="middle" font-size="8" fill="#fcd34d" font-weight="700">BIRTH</text>

  <!-- ═══ STEP 4: INDEXER DETECTS INSCRIPTION ═══ -->
  <text x="50" y="490" font-size="10" fill="#666" font-weight="700">4</text>

  <!-- Arrow: Bitcoin → Indexer (watches) -->
  <path d="M 260 400 Q 320 420 380 450" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a-p)"/>
  <text x="340" y="420" font-size="8" fill="#a78bfa">block watcher</text>

  <rect x="310" y="460" width="180" height="65" rx="8" fill="#0d1117" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="482" text-anchor="middle" font-size="10" fill="#a78bfa" font-weight="600">Index Inscription</text>
  <text x="400" y="498" text-anchor="middle" font-size="9" fill="#888">Parse inscription data</text>
  <text x="400" y="512" text-anchor="middle" font-size="9" fill="#888">Append ".jeffe" suffix</text>

  <!-- ═══ STEP 5: WRITE TO POSTGRES CACHE ═══ -->
  <text x="50" y="580" font-size="10" fill="#666" font-weight="700">5</text>

  <!-- Arrow: Indexer → Postgres -->
  <line x1="490" y1="492" x2="540" y2="555" stroke="#10b981" stroke-width="1.5" marker-end="url(#a-g)"/>
  <text x="530" y="520" font-size="8" fill="#34d399">cache write</text>

  <rect x="540" y="545" width="180" height="90" rx="8" fill="#0d1117" stroke="#10b981" stroke-width="1.5"/>
  <text x="630" y="567" text-anchor="middle" font-size="10" fill="#34d399" font-weight="600">namespace_registrations</text>
  <text x="630" y="585" text-anchor="middle" font-size="9" fill="#888">namespace_name:</text>
  <text x="630" y="600" text-anchor="middle" font-size="9" fill="#34d399" font-weight="600">"sunrise-coffee.jeffe"</text>
  <text x="630" y="618" text-anchor="middle" font-size="9" fill="#888">merchant_id: FK → merchants</text>

  <!-- L3 Cache badge -->
  <rect x="655" y="548" width="55" height="16" rx="8" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="682" y="559" text-anchor="middle" font-size="8" fill="#6ee7b7" font-weight="700">CACHE</text>

  <!-- ═══ STEP 6: APP READS FROM CACHE ═══ -->
  <text x="50" y="690" font-size="10" fill="#666" font-weight="700">6</text>

  <line x1="720" y1="590" x2="770" y2="660" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a-b)"/>
  <text x="760" y="630" font-size="8" fill="#3b82f6">query</text>

  <rect x="770" y="650" width="160" height="50" rx="8" fill="#0d1117" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="850" y="672" text-anchor="middle" font-size="10" fill="#60a5fa" font-weight="600">App reads cache</text>
  <text x="850" y="688" text-anchor="middle" font-size="9" fill="#888">Fast lookup by name</text>

  <!-- ═══ KEY INSIGHT BOX: NAMING CONVENTION ═══ -->
  <rect x="310" y="680" width="380" height="80" rx="10" fill="#0d1117" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="310" y="680" width="380" height="80" rx="10" fill="#f59e0b" opacity="0.03"/>

  <text x="500" y="702" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700" letter-spacing="0.5">NAMING CONVENTION</text>

  <!-- Two-column comparison -->
  <text x="420" y="722" text-anchor="middle" font-size="9" fill="#fbbf24" font-weight="600">₿ Bitcoin (canonical)</text>
  <text x="420" y="738" text-anchor="middle" font-size="10" fill="#888" font-family="'SF Mono', monospace">"sunrise-coffee"</text>
  <text x="500" y="730" text-anchor="middle" font-size="14" fill="#555">→</text>
  <text x="590" y="722" text-anchor="middle" font-size="9" fill="#34d399" font-weight="600">Postgres (derived)</text>
  <text x="590" y="738" text-anchor="middle" font-size="10" fill="#888" font-family="'SF Mono', monospace">"sunrise-coffee.jeffe"</text>
  <text x="500" y="754" text-anchor="middle" font-size="8" fill="#666">Indexer appends ".jeffe" suffix when caching. Strips it when constructing inscriptions.</text>

  <!-- ═══ RECOVERY SCENARIO ═══ -->
  <rect x="100" y="800" width="800" height="110" rx="12" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="100" y="800" width="800" height="110" rx="12" fill="#ef4444" opacity="0.03"/>

  <text x="500" y="825" text-anchor="middle" font-size="11" fill="#f87171" font-weight="700" letter-spacing="1">RECOVERY SCENARIO — POSTGRES DIES</text>

  <!-- Step A -->
  <rect x="130" y="840" width="160" height="50" rx="6" fill="#0d1117" stroke="#f59e0b" stroke-width="1"/>
  <text x="210" y="860" text-anchor="middle" font-size="9" fill="#fbbf24" font-weight="600">₿ Inscription survives</text>
  <text x="210" y="876" text-anchor="middle" font-size="8" fill="#888">"sunrise-coffee" on-chain</text>

  <text x="310" y="868" font-size="14" fill="#555">→</text>

  <!-- Step B -->
  <rect x="330" y="840" width="160" height="50" rx="6" fill="#0d1117" stroke="#8b5cf6" stroke-width="1"/>
  <text x="410" y="860" text-anchor="middle" font-size="9" fill="#a78bfa" font-weight="600">Indexer re-scans chain</text>
  <text x="410" y="876" text-anchor="middle" font-size="8" fill="#888">Finds all namespace inscriptions</text>

  <text x="510" y="868" font-size="14" fill="#555">→</text>

  <!-- Step C -->
  <rect x="530" y="840" width="170" height="50" rx="6" fill="#0d1117" stroke="#10b981" stroke-width="1"/>
  <text x="615" y="860" text-anchor="middle" font-size="9" fill="#34d399" font-weight="600">Postgres rebuilt</text>
  <text x="615" y="876" text-anchor="middle" font-size="8" fill="#888">Cache fully reconstructed</text>

  <text x="720" y="868" font-size="14" fill="#555">→</text>

  <!-- Step D -->
  <rect x="740" y="840" width="130" height="50" rx="6" fill="#0d1117" stroke="#3b82f6" stroke-width="1"/>
  <text x="805" y="860" text-anchor="middle" font-size="9" fill="#60a5fa" font-weight="600">App resumes</text>
  <text x="805" y="876" text-anchor="middle" font-size="8" fill="#888">Zero data loss</text>

  <!-- ═══ ARCHITECTURAL IMPLICATION BOX ═══ -->
  <rect x="140" y="940" width="720" height="70" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="140" y="940" width="720" height="70" rx="12" fill="#f59e0b" opacity="0.03"/>
  <text x="500" y="965" text-anchor="middle" font-size="11" fill="#fbbf24" font-weight="600">SCHEMA IMPLICATION</text>
  <text x="500" y="985" text-anchor="middle" font-size="10" fill="#888">No hard FK from merkle_batches → namespace_registrations. Soft reference only.</text>
  <text x="500" y="1000" text-anchor="middle" font-size="10" fill="#888">The inscription exists before the cache row. The cache cannot constrain the ledger.</text>

  <!-- Footer -->
  <text x="500" y="1060" text-anchor="middle" font-size="9" fill="#444">APPLICATION 63/991,596 · Filed February 26, 2026 · PATENT PENDING · CONFIDENTIAL</text>
</svg>
