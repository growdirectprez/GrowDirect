{% extends "base.html" %}
{% block main %}
<h1 class="text-2xl font-semibold mb-6">Admin sign in</h1>
{% if error %}<p class="text-red-600 mb-4">Invalid credentials.</p>{% endif %}
<form method="post" action="{{ url_for('admin_auth.login_submit') }}" class="max-w-sm space-y-4">
  <input name="email" type="email" placeholder="Email" required class="w-full border p-2">
  <input name="password" type="password" placeholder="Password" required class="w-full border p-2">
  <button type="submit" class="bg-stone-900 text-white px-4 py-2">Sign in</button>
</form>
<hr class="my-6">
<form method="post" action="{{ url_for('admin_auth.request_magic') }}" class="max-w-sm space-y-4">
  <input name="email" type="email" placeholder="Email for magic link" required class="w-full border p-2">
  <button type="submit" class="border px-4 py-2">Email me a magic link</button>
</form>
{% endblock %}
