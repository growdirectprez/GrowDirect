{% extends "account/_layout.html" %}
{% block account_main %}
<div class="mb-4">
  <a href="/account/orders/{{ order.id }}" class="text-sm text-stone-500 underline">&larr; Back to order</a>
</div>
<h1 class="text-2xl font-semibold mb-6">Request return — {{ order.public_token }}</h1>
<form action="/account/orders/{{ order.id }}/return" method="post" class="max-w-md space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">Describe the issue</label>
    <textarea name="reason" rows="5" required
              class="w-full border border-stone-300 rounded p-2 focus:outline-none focus:ring-1 focus:ring-stone-500"
              placeholder="What's wrong with your order?"></textarea>
  </div>
  <button type="submit"
          class="bg-stone-900 text-white px-4 py-2 rounded text-sm">Submit return request</button>
</form>
{% endblock %}
