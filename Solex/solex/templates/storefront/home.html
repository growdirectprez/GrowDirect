{% extends "base.html" %}
{% block main %}
<section class="py-12">
  <h1 class="text-3xl font-semibold mb-6">Welcome to Solex</h1>
  <p class="text-stone-600 mb-8">Frequency, wellness, and life-force technology.</p>
  <a href="{{ url_for('storefront.shop') }}" class="inline-block bg-stone-900 text-white px-5 py-2 rounded">Shop all</a>
</section>
<section class="py-8">
  <h2 class="text-xl font-semibold mb-4">Featured</h2>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    {% for p in products %}
    <a href="{{ url_for('storefront.product_detail', slug=p.slug) }}" class="block">
      <div class="aspect-square bg-stone-100 mb-2"></div>
      <div class="text-sm font-medium">{{ p.name }}</div>
      <div class="text-sm text-stone-600">${{ '%.2f' % (p.price_cents / 100) }}</div>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
