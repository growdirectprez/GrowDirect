{% extends "base.html" %}
{% block main %}
<div class="flex gap-8">
  <aside class="w-48 shrink-0">
    <h3 class="font-semibold mb-3">Categories</h3>
    <ul class="space-y-2 text-sm">
      <li><a href="{{ url_for('storefront.shop') }}" class="{% if not active_slug %}font-semibold{% endif %}">All</a></li>
      {% for c in categories %}
      <li><a href="{{ url_for('storefront.shop_by_category', slug=c.slug) }}" class="{% if active_slug == c.slug %}font-semibold{% endif %}">{{ c.name }}</a></li>
      {% endfor %}
    </ul>
  </aside>
  <section class="flex-1">
    <h1 class="text-2xl font-semibold mb-6">Shop</h1>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
      {% for p in products %}
      <a href="{{ url_for('storefront.product_detail', slug=p.slug) }}" class="block">
        <div class="aspect-square bg-stone-100 mb-2"></div>
        <div class="text-sm font-medium">{{ p.name }}</div>
        <div class="text-xs text-stone-500">{{ p.short_description }}</div>
        <div class="text-sm text-stone-700 mt-1">${{ '%.2f' % (p.price_cents / 100) }}</div>
      </a>
      {% endfor %}
    </div>
  </section>
</div>
{% endblock %}
