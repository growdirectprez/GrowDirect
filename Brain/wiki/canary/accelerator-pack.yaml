# -----------------------------------------------------------------------------
# EXTENSIONS — Beyond the RapidPOS Surface
# -----------------------------------------------------------------------------
# What the gateway enables that Counterpoint VARs don't sell. Source: PwC §5
# "and more" surface + platform thesis cards.

extensions:
  accountability-rails:
    description: Native to the platform; no competitive analog. Capability language used here is the public-facing surface — the technical implementation lives in architecture documents and code.
    capabilities:
      - name: Closed-graph variance accountability (operational rail)
        module: chirp + fox
        source: platform-thesis card
        # implementation: chirp signal + fox case graph — already capability-language native
      - name: Gated open-to-buy with verifiable settlement enforcement (financial rail)
        module: otb-settlement
        source: platform-l402-ildwac-moat card
        # implementation: L402-gated commitment over Lightning; satoshi-denominated wallet enforces the cap at the protocol level, not at the policy level. See platform-l402-ildwac-moat card for full architecture.
      - name: Cryptographic evidence anchor (immutable audit chain) (evidentiary rail)
        module: evidence-anchor
        source: infra-blockchain-evidence-anchor card
        # implementation: Bitcoin L2 ordinals inscription with Merkle proof; chain hash anchored on public L2 for non-repudiation. See infra-blockchain-evidence-anchor card for full architecture.
      - name: Provenance-weighted cost model with verifiable settlement
        module: provenance-weighted-cost
        source: platform-l402-ildwac-moat card
        # implementation: ILDWAC — Inventory-Linked Denominated Weighted-Average Cost in satoshis; cost basis is hash-anchored to the original purchase settlement event. See platform-l402-ildwac-moat card for full architecture.
      - name: Vendor SLA accountability (vendor rail)
        module: vendor-sla-ledger
        source: platform-thesis card (Rail 4)
        # implementation: OpenTelemetry assertions against published cloud SLAs, accumulated in ledger.vendor_sla_variances, anchored to L2 alongside Fox case evidence. See platform-thesis card §Rail 4 for full architecture.

  agent-network:
    description: Operational PMO surface; zero competitive analog
    capabilities:
      - name: ALX, ALXjr (mini-resident), Canary Builder, Cove Builder, Jeffe
        module: agent-network
        source: platform-alx-vsm card

  signal-feeds:
    description: Local-market intelligence; zero competitive analog in SMB POS
    capabilities:
      - name: Seasonality signal
        source: signal-seasonality card
      - name: Weather + Zone SEO signal
        source: signal-weather-seo card
      - name: Social threat detection signal
        source: signal-social-threat card
      - name: Civil services signal
        source: signal-civil-services card
      - name: Community intelligence signal
        source: signal-community-intel card
      - name: Property and landlord signal
        source: signal-property-landlord card

