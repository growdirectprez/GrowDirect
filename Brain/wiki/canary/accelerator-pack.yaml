# GrowDirect Accelerator Pack — Manifest
# ----------------------------------------
# Source-of-truth registry of what the platform gateway enables.
# Generated from the RapidPOS feature map §6 (51 integrations) plus extensions.
# Drives /accelerator-pack page on growdirect.io and partner deck appendices.
#
# Tier tagging is the credibility gate. Default to poslog-bridged for v1 draft
# until founder + Bart pass confirms each entry. See platform-gateway-thesis card
# (invariant #1) for the honesty rule.

version: 0.1.1
last-updated: 2026-05-03
contract: ARTS POSLOG v6
status: draft
needs-review: true
public-language-policy: capability-only  # gateway thesis invariant #6 — public-facing copy uses capability language; Bitcoin/L402/LNURL/satoshi terminology lives in architecture docs and code only, with inline annotation

gateway:
  source-of-truth: Brain/wiki/cards/platform-gateway-thesis.md
  components:
    - namespace-protocol      # GRO-13, GRO-47–58
    - poslog-conformance      # GRO-626
    - field-capture           # pgvector schema registry, semantic field mapping
    - canary-go-spine         # 13 modules + 12 extended; consumes POSLOG
    - edge-poller             # On-prem Counterpoint bridge

tiers:
  native:
    description: Built, tested, demo-able today
    confidence: high
  poslog-bridged:
    description: Architectural support via the ARTS POSLOG contract; integration is configuration, not custom build
    confidence: medium
  roadmap:
    description: Named partnership; quarter-tagged; not yet wired
    confidence: forward-looking
  vendor-side:
    description: Register / hardware / front-of-house; owned by DriftPOS in joint product, not the Canary gateway
    confidence: partner-owned

