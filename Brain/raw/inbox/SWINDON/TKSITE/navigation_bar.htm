<html>
<head>
<title>Untitled Document</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<script language="JavaScript">
<!--
function MM_preloadImages() { //v3.0
  var d=document; if(d.images){ if(!d.MM_p) d.MM_p=new Array();
    var i,j=d.MM_p.length,a=MM_preloadImages.arguments; for(i=0; i<a.length; i++)
    if (a[i].indexOf("#")!=0){ d.MM_p[j]=new Image; d.MM_p[j++].src=a[i];}}
}

function MM_findObj(n, d) { //v3.0
  var p,i,x;  if(!d) d=document; if((p=n.indexOf("?"))>0&&parent.frames.length) {
    d=parent.frames[n.substring(p+1)].document; n=n.substring(0,p);}
  if(!(x=d[n])&&d.all) x=d.all[n]; for (i=0;!x&&i<d.forms.length;i++) x=d.forms[i][n];
  for(i=0;!x&&d.layers&&i<d.layers.length;i++) x=MM_findObj(n,d.layers[i].document); return x;
}

function MM_nbGroup(event, grpName) { //v3.0
  var i,img,nbArr,args=MM_nbGroup.arguments;
  if (event == "init" && args.length > 2) {
    if ((img = MM_findObj(args[2])) != null && !img.MM_init) {
      img.MM_init = true; img.MM_up = args[3]; img.MM_dn = img.src;
      if ((nbArr = document[grpName]) == null) nbArr = document[grpName] = new Array();
      nbArr[nbArr.length] = img;
      for (i=4; i < args.length-1; i+=2) if ((img = MM_findObj(args[i])) != null) {
        if (!img.MM_up) img.MM_up = img.src;
        img.src = img.MM_dn = args[i+1];
        nbArr[nbArr.length] = img;
    } }
  } else if (event == "over") {
    document.MM_nbOver = nbArr = new Array();
    for (i=1; i < args.length-1; i+=3) if ((img = MM_findObj(args[i])) != null) {
      if (!img.MM_up) img.MM_up = img.src;
      img.src = (img.MM_dn && args[i+2]) ? args[i+2] : args[i+1];
      nbArr[nbArr.length] = img;
    }
  } else if (event == "out" ) {
    for (i=0; i < document.MM_nbOver.length; i++) {
      img = document.MM_nbOver[i]; img.src = (img.MM_dn) ? img.MM_dn : img.MM_up; }
  } else if (event == "down") {
    if ((nbArr = document[grpName]) != null)
      for (i=0; i < nbArr.length; i++) { img=nbArr[i]; img.src = img.MM_up; img.MM_dn = 0; }
    document[grpName] = nbArr = new Array();
    for (i=2; i < args.length-1; i+=2) if ((img = MM_findObj(args[i])) != null) {
      if (!img.MM_up) img.MM_up = img.src;
      img.src = img.MM_dn = args[i+1];
      nbArr[nbArr.length] = img;
  } }
}
//-->
</script>
</head>

<body bgcolor="#FFFFFF" onLoad="MM_preloadImages('images/account_down.gif','images/account_over.gif','images/login_down.gif','images/login_over.gif','images/cart_down.gif','images/cart_over.gif','images/about_down.gif','images/about_over.gif','images/shop_down.gif','images/shop_over.gif')">
<img src="images/tkonline-store.gif" width="135" height="48" name="tk_online"> 
<a href="login_form.jsp?<%=Session.Location.linkString()%>" onClick="MM_nbGroup('down','group1','login','images/login_down.gif',1)" onMouseOver="MM_nbGroup('over','login','images/login_over.gif','',1)" onMouseOut="MM_nbGroup('out')"><img name="login" src="images/login_up.gif" border="0" onLoad=""></a> 
<a href="user_profile.jsp?<%=Session.Location.linkString()%>" onClick="MM_nbGroup('down','group1','my_acct','images/account_down.gif',1)" onMouseOver="MM_nbGroup('over','my_acct','images/account_over.gif','',1)" onMouseOut="MM_nbGroup('out')"><img name="my_acct" src="images/account_up.gif" border="0" onLoad=""></a> 
<a href="show categories.jsp?<%=Session.Location.linkString()%>" onClick="MM_nbGroup('down','group1','shop','images/shop_down.gif',1)" onMouseOver="MM_nbGroup('over','shop','images/shop_over.gif','',1)" onMouseOut="MM_nbGroup('out')"><img name="shop" src="images/shop_up.gif" border="0" onLoad=""></a><a href="shopping_cart.jsp?<%=Session.Location.linkString()%>" onClick="MM_nbGroup('down','group1','cart','images/cart_down.gif',1)" onMouseOver="MM_nbGroup('over','cart','images/cart_over.gif','',1)" onMouseOut="MM_nbGroup('out')"><img name="cart" src="images/cart_up.gif" border="0" onLoad=""></a> 
<a href="login_form.jsp?<%=Session.Location.linkString()%>" onClick="MM_nbGroup('down','group1','about','images/about_down.gif',1)" onMouseOver="MM_nbGroup('over','about','images/about_over.gif','',1)" onMouseOut="MM_nbGroup('out')"><img name="about" src="images/about_up.gif" border="0" onLoad=""></a> 
</body>
</html>
