# cloudbuild.yaml
#
# Drop-zone CI/CD pipeline for the GrowDirect monorepo.
# Triggered by the Cloud Build GitHub trigger on push to main.
#
# Builds and deploys two smoke-test services:
#   - cmd/hello   : zero-dep HTTP service, proves the pipeline shape
#   - cmd/dbcheck : connects to Cloud SQL Postgres + pgvector,
#                   proves the data path
#
# Pattern is the same for any cmd/<service>: build → push → deploy.
# See GRO-700 v3 for the dispatch context and DEPLOY.md for the workflow.

steps:
  # === hello service ===

  - id: build-hello
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/hello:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/hello:latest
      - -f
      - CanaryGo/deploy/Dockerfile.hello
      - CanaryGo

  - id: push-hello
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/hello

  - id: deploy-hello
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hello
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/hello:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8080
      - --quiet

  # === dbcheck service (connects to Cloud SQL via unix socket) ===

  - id: build-dbcheck
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/dbcheck:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/dbcheck:latest
      - -f
      - CanaryGo/deploy/Dockerfile.dbcheck
      - CanaryGo

  - id: push-dbcheck
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/dbcheck

  - id: deploy-dbcheck
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - dbcheck
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/dbcheck:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8080
      - --add-cloudsql-instances=canary-rapidpos:us-central1:canary-rapidpos-db
      - --set-secrets=DATABASE_URL=db-url:latest
      - --quiet

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/hello
  - us-central1-docker.pkg.dev/$PROJECT_ID/canary-go/dbcheck

options:
  logging: CLOUD_LOGGING_ONLY
