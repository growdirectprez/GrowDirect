name: viva

services:
  api:
    image: viva-api
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: viva_api
    ports:
      - "5003:5000"
    volumes:
      - ../viva:/app/viva
      - ../templates:/app/templates
      - ../static:/app/static
      - ../wsgi.py:/app/wsgi.py
      - ../migrations:/app/migrations
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://growdirect:growdirect_dev@growdirect_postgres:5432/viva
      VALKEY_URL: redis://growdirect_valkey:6379/2
      SECRET_KEY: dev-secret
      VIVA_PHASE: research
      VIVA_PAPER_MODE: "true"
      VIVA_KILL_SWITCH_PCT: "0.15"
      VIVA_MAX_POSITION_PCT: "0.30"
      VIVA_DEPLOYED_CAPITAL_SATS: "0"
    networks:
      - growdirect

  # Signal worker — async event loop, NOT Flask
  # Uncomment when signal layer is implemented
  # signal-worker:
  #   image: viva-api
  #   container_name: viva_signal_worker
  #   command: python3 -m viva.signals.runner
  #   volumes:
  #     - ../viva:/app/viva
  #   environment:
  #     DATABASE_URL: postgresql://growdirect:growdirect_dev@growdirect_postgres:5432/viva
  #     VALKEY_URL: redis://growdirect_valkey:6379/2
  #     VIVA_PAPER_MODE: "true"
  #   networks:
  #     - growdirect

  # Execution worker — async, reads from Valkey queue
  # Uncomment when execution layer is implemented
  # exec-worker:
  #   image: viva-api
  #   container_name: viva_exec_worker
  #   command: python3 -m viva.execution.runner
  #   volumes:
  #     - ../viva:/app/viva
  #   environment:
  #     DATABASE_URL: postgresql://growdirect:growdirect_dev@growdirect_postgres:5432/viva
  #     VALKEY_URL: redis://growdirect_valkey:6379/2
  #     VIVA_PAPER_MODE: "true"
  #   networks:
  #     - growdirect

networks:
  growdirect:
    external: true
